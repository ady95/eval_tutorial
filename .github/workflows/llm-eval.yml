# 09-2 LLM 회귀 평가를 CI 에 연결하는 예시입니다.
# 비용이 드는 작업이라 Actions 화면에서 사람이 직접 실행할 때만 돌게 했습니다(workflow_dispatch).
# 쓰기 전에 준비할 것
#   1) 저장소 Settings → Secrets and variables → Actions 에 OPENAI_API_KEY 를 등록합니다.
#      임베딩 서버를 따로 쓰면 EMBEDDING_BASE_URL, EMBEDDING_API_KEY 도 등록합니다.
#   2) 기준선 결과 3개(results/ch09_run_baseline-1~3.json)를 baseline/ 폴더에 복사해 커밋합니다.
name: llm-eval

on:
  workflow_dispatch:
    inputs:
      full:
        description: "42문항 전체를 평가합니다 (끄면 스모크 10문항)"
        type: boolean
        default: false
  # pull_request:                       # PR 마다 스모크 평가를 돌리려면 주석을 풉니다
  #   paths: ["ch05/**", "ch09/**", "data/**"]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
      EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_MODEL: bge-m3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt numpy
      - name: 기준선 불러오기
        run: mkdir -p results && cp baseline/ch09_run_baseline-*.json results/
      - name: 스모크 평가 (10문항)
        if: ${{ !inputs.full }}
        run: |
          python -m ch09.run_eval --run ci --smoke
          python -m ch09.regression_gate ci --smoke
      - name: 전체 평가 (42문항)
        if: ${{ inputs.full }}
        run: |
          python -m ch09.run_eval --run ci
          python -m ch09.regression_gate ci
      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/ch09_run_ci.json

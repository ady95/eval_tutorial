# 09-2 LLM 회귀 평가를 CI 에 연결하는 예시입니다.
# 비용이 드는 작업이라 Actions 화면에서 사람이 직접 실행할 때만 돌게 했습니다(workflow_dispatch).
# 쓰기 전에 준비할 것
#   1) 저장소 Settings → Secrets and variables → Actions 에 다음을 등록합니다.
#      - OPENAI_API_KEY
#      - EMBEDDING_BASE_URL: GitHub 러너에서 접근할 수 있는 bge-m3 임베딩 서버 주소(OpenAI 방식, 필수).
#        러너의 localhost 에는 여러분 PC 의 Ollama 가 없고, 비워 두면 OpenAI 주소로 bge-m3 를 찾다가 실패합니다.
#        OpenAI 임베딩 모델로 바꾸려면 EMBEDDING_MODEL 을 고치고, 그 모델로 기준선을 다시 만들어야 합니다.
#      - EMBEDDING_API_KEY: 임베딩 서버에 키가 필요하면 등록합니다.
#   2) 기준선 결과 3개(results/ch09_run_baseline-1~3.json)를 baseline/ 폴더에 복사해 커밋합니다.
#      정책 게이트를 쓰므로 기준선에도 python -m ch09.policy_check baseline-1 baseline-2 baseline-3 을 먼저 실행해 둡니다.
name: llm-eval

on:
  workflow_dispatch:
    inputs:
      full:
        description: "42문항 전체를 평가합니다 (끄면 스모크 10문항)"
        type: boolean
        default: false
  # pull_request:                       # PR 마다 스모크 평가를 돌리려면 주석을 풉니다
  #   paths: ["ch05/**", "ch09/**", "data/**"]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna
      EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_MODEL: bge-m3
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"   # policy_check 가 쓰는 DeepEval 의 사용 통계를 끕니다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 준비물 확인
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY Secret 이 없습니다"; exit 1; }
          test -n "$EMBEDDING_BASE_URL" || { echo "EMBEDDING_BASE_URL Secret 이 없습니다 (bge-m3 임베딩 서버 주소)"; exit 1; }
      - run: pip install -r requirements.txt numpy "deepeval==4.2.5"
      - name: 기준선 불러오기
        run: mkdir -p results && cp baseline/ch09_run_baseline-*.json results/
      - name: 스모크 평가 (10문항)
        if: ${{ !inputs.full }}
        run: |
          python -m ch09.run_eval --run ci --smoke
          python -m ch09.policy_check ci
          python -m ch09.regression_gate ci --smoke
      - name: 전체 평가 (42문항)
        if: ${{ inputs.full }}
        run: |
          python -m ch09.run_eval --run ci
          python -m ch09.policy_check ci
          python -m ch09.regression_gate ci
      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/ch09_run_ci.json
